<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício boas práticas de CSS</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- Bloco "produtos": a lista de produtos -->
    <div class="produtos">
        <!-- Bloco "produto" com seus elementos produto__imagem, produto__nome e produto__descricao -->
        <div class="produto">
            <img class="produto__imagem" src="https://placehold.co/100x100" alt="Imagem do produto">
            <h4 class="produto__nome">Nome do produto</h4>
            <p class="produto__descricao">
                Descrição do produto
            </p>
        </div>
        <!-- Modificador produto--destaque -->
        <div class="produto produto--destaque">
            <img class="produto__imagem" src="https://placehold.co/100x100" alt="Imagem do produto">
            <h4 class="produto__nome">Nome do produto</h4>
            <p class="produto__descricao">
                Descrição do produto
            </p>
        </div>
        <div class="produto">
            <img class="produto__imagem" src="https://placehold.co/100x100" alt="Imagem do produto">
            <h4 class="produto__nome">Nome do produto</h4>
            <p class="produto__descricao">
                Descrição do produto
            </p>
        </div>
    </div>
</body>
</html>
